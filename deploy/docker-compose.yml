# Production: n8n behind Caddy. E2E (profile "e2e"): a throwaway n8n plus a test runner, never touching production data.
services:
  n8n:
    image: n8nio/n8n:2.44.6
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"   # editor only via `scripts/server.sh editor` (SSH tunnel)

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  n8n-e2e:
    profiles: ["e2e"]
    image: n8nio/n8n:2.44.6
    environment:
      GENERIC_TIMEZONE: Asia/Singapore
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "1"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      PK_PUSH_SENDER: tok-sender
    volumes:
      - e2e-data:/home/node/.n8n
      - ./repo/n8n/dist:/workflows:ro

  e2e-runner:
    profiles: ["e2e"]
    image: node:24-bookworm-slim
    working_dir: /repo
    environment:
      PK_E2E_BASE: http://n8n-e2e:5678
      MOCK_HOST: 0.0.0.0
    volumes:
      - ./repo:/repo
    command: ["node", "--test", "--test-concurrency=1", "tests/e2e/*.e2e.test.js"]

volumes:
  caddy-data:
  e2e-data:
